[package]
name = "sweat_jar"
version = "4.2.3"
authors = ["Sweat Economy"]
edition = "2021"
repository = "https://github.com/sweatco/sweat-jar"

[lib]
# `rlib` so test crates can use this crate's types (`Roles`, `RoleAssignments`).
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[features]
default = ["release"]
release = ["sweat-jar-model/release-api"]
integration-methods = ["sweat-jar-model/integration-methods"]
integration-test = [
    "sweat-jar-model/release-api",
    "integration-methods",
]
# Compiles the test-only simulation helpers (`common::testing`, `common::env::test_env_ext`,
# the store-events `emit`) into a non-test build so the `replay/` reconciliation crate can reuse them.
replay-engine = ["dep:rstest", "near-sdk/unit-testing", "sweat-jar-model/testing", "sweat-jar-model/replay-engine"]
# On top of `replay-engine`: reconcile against "what should have been paid"
# (current score-window logic) instead of "what was actually paid" (the
# pre-v4.2.3 bug reproduced by `replay-engine` alone). See the feature's own
# doc in `model/Cargo.toml` / `model/src/data/score/mod.rs`.
corrected-score-window = ["sweat-jar-model/corrected-score-window"]

[dependencies]
mutants = { workspace = true }

near-sdk = { workspace = true }
near-contract-standards = { workspace = true }
near-plugins = { workspace = true }
primitive-types = { workspace = true }
strum = { workspace = true }

sweat-jar-model = { workspace = true }
sweat-jar-primitives = { workspace = true }

# Test-only helper deps, compiled into the lib only under `replay-engine`
# (otherwise dev-only — see `[dev-dependencies]`).
rstest = { workspace = true, optional = true }

[dev-dependencies]
fake = { workspace = true }
anyhow = { workspace = true }
itertools = { workspace = true }
sweat-jar-model = { workspace = true, features = ["testing"] }
rstest = { workspace = true }

# unit-testing pulls near-vm-runner/near-crypto (wasmtime, C-compiled
# secp256k1) — dev-only so the wasm build never needs a wasm32-capable
# C toolchain.
near-sdk = { workspace = true, features = ["unit-testing"] }
