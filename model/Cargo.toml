[package]
name = "sweat-jar-model"
version = "4.2.3"
publish = false
edition = "2021"

[lib]
name = "sweat_jar_model"


[features]
default = []
integration-methods = []
release-api = []
testing = ["dep:rand"]
# Host-only: makes AccountScore::shift()/wipe() reproduce the pre-v4.2.3 score
# window behaviour (see contract/Cargo.toml's `replay-engine` feature doc).
replay-engine = []
# Overrides `replay-engine`'s score-window reproduction back to current (fixed)
# behavior — "what should have been paid" instead of "what was actually paid".
# No effect without `replay-engine`.
corrected-score-window = []

[dependencies]
sweat-jar-primitives = { workspace = true }
near-sdk = { workspace = true }

ed25519-dalek = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true, optional = true }
sha2 = "0.10.8"
strum = { workspace = true }

[dev-dependencies]
fake = { workspace = true }
